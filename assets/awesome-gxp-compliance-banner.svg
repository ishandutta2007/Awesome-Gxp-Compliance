<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 13px;
      }
      .floating-node {
        animation: floatSlow 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Cyber Compliance Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#38bdf8" stroke-width="1" />
    <path d="M100 0 V380 M200 0 V380 M300 0 V380 M400 0 V380 M500 0 V380 M600 0 V380 M700 0 V380 M800 0 V380 M900 0 V380 M1000 0 V380 M1100 0 V380" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Ambient Rings -->
  <g opacity="0.6" filter="url(#glow)">
    <circle cx="1020" cy="180" r="130" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="16 12">
      <animateTransform attributeName="transform" type="rotate" from="0 1020 180" to="360 1020 180" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="180" r="90" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 8">
      <animateTransform attributeName="transform" type="rotate" from="360 1020 180" to="0 1020 180" dur="18s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right Visual / Compliance Shield & DNA Motif -->
  <g transform="translate(1020, 180)" class="floating-node">
    <!-- Center Shield -->
    <path d="M0 -55 L45 -30 V15 C45 42 0 65 0 65 C0 65 -45 42 -45 15 V-30 Z" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="3.5" filter="url(#cardGlow)" />
    <!-- Checkmark -->
    <path d="M-14 3 L-3 14 L18 -10" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,100;100,0;100,0" dur="3s" repeatCount="indefinite" />
    </path>
    <!-- GxP Ring satellites -->
    <circle cx="0" cy="-85" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="75" cy="45" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="-75" cy="45" r="5" fill="#c084fc">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left / Main Header Content -->
  <!-- Top Category Tag -->
  <g transform="translate(70, 60)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#10b981">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" fill="#94a3b8" class="tag-text">LIFE SCIENCES &amp; GxP ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="145" fill="url(#primaryGrad)" class="title-text" font-size="44" filter="url(#glow)">Awesome-GxP-Compliance</text>

  <!-- Subtitle / Value Prop -->
  <text x="70" y="195" fill="#f8fafc" class="sub-text" font-size="20">Curated Architecture of eQMS, 21 CFR Part 11, Validation &amp; Quality Systems</text>
  <text x="70" y="225" fill="#94a3b8" class="sub-text" font-size="16">SaaS Category Leaders • Open-Source Frameworks • CSV / CSA Lifecycle Tools</text>

  <!-- Compliance Pills -->
  <g transform="translate(70, 275)">
    <!-- Pill 1: 21 CFR Part 11 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
      <text x="18" y="23" fill="#38bdf8" class="tag-text">⚡ FDA 21 CFR Part 11</text>
    </g>

    <!-- Pill 2: ISO 13485 -->
    <g transform="translate(180, 0)">
      <rect width="135" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="16" y="23" fill="#34d399" class="tag-text">🛡️ ISO 13485</text>
    </g>

    <!-- Pill 3: GAMP 5 / CSA -->
    <g transform="translate(330, 0)">
      <rect width="155" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="16" y="23" fill="#c084fc" class="tag-text">📋 GAMP 5 &amp; CSA</text>
    </g>

    <!-- Pill 4: EU Annex 11 -->
    <g transform="translate(500, 0)">
      <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="16" y="23" fill="#fbbf24" class="tag-text">🇪🇺 EU Annex 11</text>
    </g>

    <!-- Pill 5: eQMS / CAPA -->
    <g transform="translate(660, 0)">
      <rect width="140" height="36" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="16" y="23" fill="#f472b6" class="tag-text">🔬 eQMS &amp; CAPA</text>
    </g>
  </g>
</svg>
